  .progress-container{width:100%;height:9px;background:#e4e9ef;border-radius:10px;overflow:hidden;margin-bottom:20px}

.question-number{font-size:14px;color:#607d8b;margin-bottom:10px}

.options{display:grid;grid-template-columns:1fr;gap:12px}  
.option{display:flex;align-items:flex-start;gap:12px;border:2px solid #dce3eb;border-radius:10px;padding:14px;cursor:pointer;background:white;overflow-wrap:anywhere}

.option.selected{border-color:#1976d2;background:#eaf4ff}

.option.selected .option-letter{background:#1976d2;color:white}  
.option-content{flex:1;min-width:0;line-height:1.7}  
.navigation{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:25px}  
button{border:0;border-radius:8px;padding:12px 18px;font-size:15px;font-weight:bold;cursor:pointer}  
button:disabled{opacity:.4;cursor:not-allowed}  
.btn-secondary{background:#e5eaf0;color:#263238}  
.btn-primary{background:#1976d2;color:white}  
.btn-submit{background:#2e7d32;color:white}

#navigationStatus{color:#607d8b;font-size:13px;font-weight:normal}  
.category-navigation{margin-top:12px;border:1px solid #dce3eb;border-radius:10px;overflow:hidden}  
.category-navigation>summary{padding:14px;background:#f3f6fa;cursor:pointer;font-weight:bold}  
.category-questions{display:flex;flex-wrap:wrap;gap:8px;padding:12px}  
.category-questions button{width:42px;height:42px;padding:0;background:#e8edf3;color:#263238}  
.category-questions button.current{background:#1976d2;color:white}  
.category-questions button.answered{box-shadow:inset 0 -4px #43a047}  
.category-empty{padding:12px;color:#78909c;font-size:14px}  
.result{text-align:center;padding:25px 10px}

.result-pass{color:#2e7d32}

.review-incorrect{background:#ffebee}  
.hidden{display:none!important}

 body{padding:10px}

        ">":"&gt;",  
        '"':"&quot;",  
        "'":"&#39;"  
    })[character]);  
}

/* ===================== RENDER TEKS / GAMBAR / AUDIO ===================== */  
  
function renderContent(content, imageClass = "media-image") {  
    if (content === null || content === undefined) return "";  
  
    // TEKS BIASA  
    if (typeof content === "string" || typeof content === "number") {  
        return escapeHTML(content);  
    }  
  
    if (typeof content !== "object") return "";  
  
    // TEKS DENGAN GARIS BAWAH  
    if (content.type === "text") {  
        let output = escapeHTML(content.content || "");  
  
        if (Array.isArray(content.underline)) {  
            content.underline.forEach(word => {  
                const escapedWord = escapeHTML(word);  
                if (!escapedWord) return;  
  
                const safeWord = escapedWord.replace(  
                    /[.*+?^${}()|[\]\\]/g,  
                    "\\$&"  
                );  
  
                output = output.replace(  
                    new RegExp(safeWord, "g"),  
                    '<span class="underlined-word">$&</span>'  
                );  
            });  
        }  
  
        return output;  
    }  
  
    // PERCAKAPAN HYOUGEN  
    if (content.type === "conversation") {  
        if (!Array.isArray(content.lines)) return "";  
  
        return `  
            <div class="conversation">  
                ${content.lines.map(line => `  
                    <div class="conversation-line">  
                        <span class="conversation-speaker">  
                            ${escapeHTML(line.speaker || "")}  
                        </span>  
                        <span class="conversation-text">  
                            ${escapeHTML(line.text || "")}  
                        </span>  
                    </div>  
                `).join("")}  
            </div>  
        `;  
    }  
  
    // GAMBAR  
    if (content.type === "image") {  
        if (!content.src) return "";  
  
        return `  
            <img  
                class="${imageClass}"  
                src="${escapeHTML(content.src)}"  
                alt="${escapeHTML(content.alt || "Gambar soal")}"  
                loading="eager"  
                onerror="this.style.display='none'"  
            >  
        `;  
    }  
  
  // AUDIO  
// AUDIO  
if (content.type === "audio") {  
    if (!content.src) return "";  
  
    const audioId = "audio-" + Math.random().toString(36).slice(2);  
  
    // Setiap file audio memiliki hitungan sendiri  
    const audioKey = content.src;  
    const count = audioPlayCounts.get(audioKey) || 0;  
  
    let buttonText = "▶ Play Audio";  
  
    if (count === 1) {  
        buttonText = "▶ Putar lagi (1 kali)";  
    } else if (count >= 2) {  
        buttonText = "Audio selesai";  
    }  
  
    return `  
        <div class="audio-player">  
            <audio  
                id="${audioId}"  
                src="${escapeHTML(content.src)}"  
                preload="none">  
            </audio>  
  
            <button  
                type="button"  
                class="audio-play-button"  
                data-audio-id="${audioId}"  
                data-audio-key="${escapeHTML(audioKey)}"  
                ${count >= 2 ? "disabled" : ""}>  
                ${buttonText}  
            </button>  
  
            <span class="audio-limit">Maksimal 2 kali</span>  
        </div>  
    `;  
}  
    // KOMBINASI GAMBAR + AUDIO  
    if (content.type === "media") {  
        let output = "";  
  
        if (content.image) {  
            output += renderContent({  
                type: "image",  
                src: content.image,  
                alt: content.alt || "Gambar soal"  
            }, imageClass);  
        }  
  
        if (content.audio) {  
            output += renderContent({  
                type: "audio",  
                src: content.audio,  
                alt: content.audioAlt || "Audio soal"  
            });  
        }  
  
        return `  
            <div class="combined-media">  
                ${output}  
            </div>  
        `;  
    }  
  
    return "";  
}  
document.addEventListener("click", async function(e) {  
    const button = e.target.closest(".audio-play-button");  
  
    if (!button) return;  
  
    const audioId = button.dataset.audioId;  
    const audioKey = button.dataset.audioKey;  
    const audio = document.getElementById(audioId);  
  
    if (!audio || button.disabled) return;  
  
    let count = audioPlayCounts.get(audioKey) || 0;  
  
    // Maksimal 2 kali pemutaran  
    if (count >= 2) {  
        button.textContent = "Audio selesai";  
        button.disabled = true;  
        return;  
    }  
  
    // Jangan mulai lagi jika audio sedang diputar  
    if (!audio.paused) return;  
  
    try {  
        audio.currentTime = 0;  
  
        // Tambahkan hitungan setelah pemutaran berhasil dimulai  
        await audio.play();  
  
        count++;  
        audioPlayCounts.set(audioKey, count);  
  
        button.textContent = "▶ Memutar...";  
  
    } catch (error) {  
        console.error("Audio gagal diputar:", error);  
        button.textContent = "▶ Coba lagi";  
        return;  
    }  
  
    audio.onended = function() {  
        const total = audioPlayCounts.get(audioKey) || 0;  
  
        if (total >= 2) {  
            button.textContent = "Audio selesai";  
            button.disabled = true;  
        } else {  
            button.textContent = "▶ Putar lagi (1 kali)";  
        }  
    };  
});  
    function resetAudioPlayCounts() {  
    Object.keys(localStorage).forEach(key => {  
        if (key.startsWith("audioPlayCount:v3:")) {  
            localStorage.removeItem(key);  
        }  
    });  
}  
    
    function renderPassage(passage) {
    if (!passage) return "";

    // Jika bacaan menggunakan ID dari dokkaiPassages
    if (typeof passage === "string") {
        passage = dokkaiPassages[passage];
    }

    if (!passage) return "";

    const title = passage.title
        ? `<div class="passage-title">${escapeHTML(passage.title)}</div>`
        : "";

    let content = "";

    if (passage.type === "image") {
        content = `
            <img
                src="${escapeHTML(passage.src)}"
                alt="${escapeHTML(passage.alt || "Bacaan Dokkai")}"
                class="passage-image"
                loading="eager"
            >
        `;
    }

    else if (passage.type === "pdf") {
        const pdfSrc = escapeHTML(passage.src);

        content = `
            <iframe
                src="${pdfSrc}"
                class="passage-pdf"
                title="${escapeHTML(passage.title || "Bacaan Dokkai")}"
            ></iframe>

            <a
                href="${pdfSrc}"
                target="_blank"
                rel="noopener noreferrer"
                class="passage-pdf-link"
            >

            </a>
        `;
    }

    else {
        return "";
    }

    return `
        <div class="passage-container">
            ${title}
            ${content}
        </div>
    `;
}

function selectAnswer(index) {

    userAnswers[currentQuestion] = index;  
    renderQuestion();  
}  
  
function previousQuestion() {  
    if (timeIsUp || quizFinished) return;  
  
    if (currentQuestion > 0) {  
        currentQuestion--;  
        renderQuestion();  
    }  
}  
  
function nextQuestion() {  
    if (timeIsUp || quizFinished) return;  
  
    if (userAnswers[currentQuestion] === null) {  
        showMessage(  
            "Soal Belum Dijawab",  
            "Silakan pilih salah satu jawaban terlebih dahulu.",  
            "warning"  
        );

    }  
  
    if (currentQuestion < quizData.length - 1) {  
        currentQuestion++;  
        renderQuestion();  
    }  
}  
  
function goToQuestion(index) {  
    if (timeIsUp || quizFinished) return;  
    if (index < 0 || index >= quizData.length) return;  
  
    const firstUnanswered = getFirstUnanswered();  
  
    if (firstUnanswered !== -1 && index > firstUnanswered) {  
        showMessage(  
            "Belum Bisa Melompat",  
            "Jawab soal sebelumnya terlebih dahulu.",  
            "warning"  
        );  
        return;  
    }  
  
    currentQuestion = index;  
    renderQuestion();  
}

/* ===================== TIMER ===================== */  
  
function formatTime(seconds) {  
    const minutes = Math.floor(seconds / 60);  
    const secs = seconds % 60;  
  
    return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;  
}  
  
function updateTimerDisplay() {  
    const timer = document.getElementById("timer");  
  
    timer.textContent = formatTime(remainingTime);  
  
    // Berkedip ketika waktu tersisa 10 menit atau kurang  
    timer.classList.toggle("warning", remainingTime <= 600);  
}  
  
function startTimer() {  
    clearInterval(timerInterval);  
    updateTimerDisplay();  
  
    // Jika waktu sudah habis, langsung kunci kuis.  
    if (remainingTime <= 0) {  
        remainingTime = 0;  
        timeIsUp = true;  
        updateTimerDisplay();  
        renderQuestion();  
        saveProgress();  
  
        showMessage(  
            "Waktu Habis",  
            "Waktu pengerjaan sudah habis. Silakan tekan tombol Selesai & Nilai.",  
            "warning"  
        );  
  
        return;  
    }  
  
    timeIsUp = false;  
  
    timerInterval = setInterval(() => {  
        if (quizFinished) {  
            clearInterval(timerInterval);  
            return;  
        }  
  
        if (remainingTime > 0) {  
            remainingTime--;  
            updateTimerDisplay();  
            saveProgress();  
        }  
  
        if (remainingTime <= 0) {  
            remainingTime = 0;  
            timeIsUp = true;  
  
            clearInterval(timerInterval);  
  
            // Simpan kondisi waktu habis.  
            updateTimerDisplay();  
            renderQuestion();  
            saveProgress();  
  
            showMessage(  
                "Waktu Habis!",  
                "Waktu pengerjaan sudah habis. Semua jawaban telah dikunci. Silakan tekan tombol Selesai & Nilai untuk melihat hasil ujian.",  
                "warning"  
            );  
        }  
    }, 1000);  
}  
  
/* ===================== SIMPAN PROGRES ===================== */  
  
function saveProgress() {  
    if (quizFinished) return;  
  
    const data = {  
        currentQuestion,  
        userAnswers,  
        remainingTime  
    };  
  
    try {  
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));  
    } catch (error) {  
        console.warn("Progres tidak dapat disimpan:", error);  
    }  
}  
  
function loadProgress() {  
    try {  
        const saved = localStorage.getItem(STORAGE_KEY);  
        if (!saved) return false;  
  
        const data = JSON.parse(saved);  
  
        if (!Array.isArray(data.userAnswers) ||  
            data.userAnswers.length !== quizData.length) {  
            return false;  
        }  
  
        userAnswers = data.userAnswers.map((answer, index) => {  
            const optionCount = quizData[index].options.length;  
  
            return Number.isInteger(answer) &&  
                answer >= 0 &&  
                answer < optionCount  
                ? answer  
                : null;  
        });  
  
        currentQuestion = Number.isInteger(data.currentQuestion)  
            ? Math.max(0, Math.min(data.currentQuestion, quizData.length - 1))  
            : 0;  
  
        remainingTime = Number.isFinite(data.remainingTime)  
            ? Math.max(0, Math.min(data.remainingTime, TIMER_DURATION))  
            : TIMER_DURATION;  
  
        return true;  
    } catch (error) {  
        console.warn("Progres tidak dapat dipulihkan:", error);  
        return false;  
    }  
}  
  
/* ===================== NILAI DAN KELULUSAN ===================== */  
  
function calculateScore() {  
    let correct = 0;  
    let wrong = 0;  
    let unanswered = 0;  
  
    quizData.forEach((question, index) => {  
        if (userAnswers[index] === null) {  
            unanswered++;  
        } else if (userAnswers[index] === question.answer) {  
            correct++;  
        } else {  
            wrong++;  
        }  
    });  
  
    // Total waktu yang digunakan  
    const elapsedTime = TIMER_DURATION - remainingTime;  
  
    return {  
        correct,  
        wrong,  
        unanswered,  
        score: correct * POINTS_PER_QUESTION,  
        passed: correct >= PASSING_SCORE,  
        elapsedTime  
    };  
}

        });

}  
    
function confirmSubmit() {  
    if (quizFinished || isFinishing) return;  
    
    const unanswered = userAnswers.filter(

    ).length;  
    
    let confirmation;  
    
    if (timeIsUp) {

            ? Swal.fire({  
                title: "Selesaikan Ujian?",  
                text: `Waktu sudah habis. Masih ada ${unanswered} soal yang belum dijawab. Soal tersebut akan dihitung sebagai tidak dijawab. Lanjutkan?`,  
                icon: "warning",  
                showCancelButton: true,  
                confirmButtonText: "Ya, Selesaikan",  
                cancelButtonText: "Batal"  
            })  
            : Promise.resolve({  
                isConfirmed: confirm(  
                    `Waktu sudah habis. Ada ${unanswered} soal belum dijawab. Selesaikan ujian?`  
                )  
            });  
    } else {  
        const firstUnanswered = getFirstUnanswered();  
        
        if (firstUnanswered !== -1) {  
            currentQuestion = firstUnanswered;  
            renderQuestion();  
            
            showMessage(  
                "Masih Ada Soal Kosong",  
                `Silakan jawab soal nomor ${firstUnanswered + 1} terlebih dahulu.`,  
                "warning"  
            );  
            
            return;  
        }  
        
        confirmation = window.Swal  
            ? Swal.fire({  
                title: "Selesaikan Ujian?",  
                text: "Semua soal sudah dijawab. Apakah Anda ingin menyelesaikan ujian?",  
                icon: "question",  
                showCancelButton: true,  
                confirmButtonText: "Ya, Selesaikan",  
                cancelButtonText: "Periksa Kembali"  
            })  
            : Promise.resolve({  
                isConfirmed: confirm(  
                    "Semua soal sudah dijawab. Selesaikan ujian?"  
                )  
            });  
    }  
    
    confirmation.then(result => {  
        if (result.isConfirmed) {  
            finishQuiz();  
        }  
    });  
}  
    
    
function finishQuiz() {
    if (quizFinished || isFinishing) return;
    
    const firstUnanswered = getFirstUnanswered();
    
    if (firstUnanswered !== -1 && !timeIsUp) {
        currentQuestion = firstUnanswered;
        renderQuestion();
        
        showMessage(
            "Masih Ada Soal Kosong",
            `Silakan jawab soal nomor ${firstUnanswered + 1} terlebih dahulu.`,
            "warning"
        );
        
        return;
    }
    
    isFinishing = true;
    quizFinished = true;
    
    clearInterval(timerInterval);
    
    const result = calculateScore();

    // Tampilkan halaman ulasan terlebih dahulu.
    // Hasil ujian belum ditampilkan.
    showRequiredReview(result);
}

                <h3>Soal ${index + 1} — ${escapeHTML(CATEGORY_NAMES[question.category] || CATEGORY_NAMES.moji_goi)}</h3>  
                <div class="question">  
    ${question.passage ? renderPassage(question.passage) : ""}
${renderContent(question.question)}  
    ${question.prompt ? `  
        <div class="question-prompt">  
            ${escapeHTML(question.prompt)}  
        </div>  
    ` : ""}  
</div>  
  
                <div class="review-answer ${isCorrect ? "review-correct" : "review-incorrect"}">  
                    <strong>Jawaban Anda:</strong><br>  
                    ${userText}  
                    <p>${isCorrect ? "Benar" : "Salah"}</p>  
                </div>  
  
                <div class="review-answer review-correct">  
                    <strong>Jawaban yang benar:</strong><br>  
                    ${correctText}  
                </div>  
            </div>  
        `;  
    });  
  
    html += `  
        <div style="text-align:center;margin-top:20px">  
            <button class="btn-primary" onclick="backToResult()">Kembali ke Hasil</button>  
            <button class="btn-secondary" onclick="restartQuiz()">Ulangi Ujian</button>  
        </div>  
    `;  
  
    resultArea.innerHTML = html;  
    window.scrollTo({top: 0, behavior: "smooth"});  
}  
  
function backToResult() {  
    renderResult(calculateScore());  
    window.scrollTo({top: 0, behavior: "smooth"});  
}  
  
/* ===================== RESET ===================== */  
  
function confirmReset() {  
    const confirmation = window.Swal  
        ? Swal.fire({  
            title: "Ulangi dari Awal?",  
            text: "Semua jawaban tersimpan akan dihapus dan waktu kembali ke 80 menit.",  
            icon: "warning",  
            showCancelButton: true,  
            confirmButtonText: "Ya, Ulangi",  
            cancelButtonText: "Batal"  
        })  
        : Promise.resolve({  
            isConfirmed: confirm("Hapus progres dan ulangi dari awal?")  
        });  
  
    confirmation.then(result => {  
        if (result.isConfirmed) restartQuiz();  
    });  
}  
  
function restartQuiz() {  
    clearInterval(timerInterval);audioPlayCounts.clear();  
  
    try {  
        localStorage.removeItem(STORAGE_KEY);resetAudioPlayCounts();  
    } catch (error) {  
        console.warn(error);  
    }  
  
    currentQuestion = 0;  
    userAnswers = new Array(quizData.length).fill(null);  
    remainingTime = TIMER_DURATION;  
    quizFinished = false;  
    isFinishing = false;  
    timeIsUp = false;  
  
    document.getElementById("quizArea").classList.remove("hidden");  
    document.getElementById("resultArea").classList.add("hidden");  
    document.getElementById("resultArea").innerHTML = "";  
    document.getElementById("questionNavigation").open = true;  
  
    renderQuestion();  
    startTimer();  
  
    window.scrollTo({top: 0, behavior: "smooth"});  
}  
  
    
/* ===================== ULASAN WAJIB ===================== */

const REVIEW_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeZBhYZjquO0haOVFN6TnOemd5b7dJYxbgC5lJu-Py1BCEks2Aqwf8WcNMuDpiVGQwCA/exec";

let pendingQuizResult = null;
let reviewToken = null;
let reviewSending = false;

/* PILIH RATING BINTANG */

function setupReviewForm() {
    const stars = document.querySelectorAll(".star-button");
    const ratingInput = document.getElementById("reviewRating");

    function updateStars(rating) {
        ratingInput.value = rating;

        stars.forEach(star => {
            const value = Number(star.dataset.rating);

            star.classList.toggle("active", value <= rating);
        });
    }

    stars.forEach(star => {
        star.addEventListener("click", () => {
            updateStars(Number(star.dataset.rating));
        });
    });

    updateStars(5);

    document.getElementById("participantReview")
        .addEventListener("submit", submitParticipantReview);
}


/* KIRIM ULASAN */

function submitParticipantReview(event) {
    event.preventDefault();

    if (reviewSending) return;

    const name = document.getElementById("reviewName")
        .value.trim();

    const rating = document.getElementById("reviewRating")
        .value;

    const opinion = document.getElementById("reviewOpinion")
        .value;

    const suggestion = document.getElementById("reviewSuggestion")
        .value.trim();

    if (!name || !opinion || !rating) {
        showMessage(
            "Data Belum Lengkap",
            "Silakan isi nama, rating, dan pendapat kamu.",
            "warning"
        );
        return;
    }

    if (!REVIEW_SCRIPT_URL.startsWith("https://script.google.com/")) {
        showMessage(
            "URL Belum Diatur",
            "Masukkan URL Web App Google Apps Script terlebih dahulu.",
            "error"
        );
        return;
    }

    const form = document.getElementById("reviewForm");

    form.action = REVIEW_SCRIPT_URL;

    const values = {
        name,
        rating,
        opinion,
        suggestion,
        score: pendingQuizResult.score,
        token: reviewToken
    };

    Object.keys(values).forEach(key => {
        form.elements[key].value = values[key];
    });

    reviewSending = true;

    const button = document.getElementById("sendReviewBtn");
    const status = document.getElementById("reviewStatus");

    button.disabled = true;
    button.textContent = "Mengirim ulasan...";
    status.textContent = "Sedang mengirim ulasan. Mohon tunggu.";

    form.submit();
}



/* ===================== TERIMA KONFIRMASI GOOGLE APPS SCRIPT ===================== */

window.addEventListener("message", function(event) {

    console.log("Pesan diterima:", event.data);

    let data = event.data;

    // Jika pesan diterima dalam bentuk teks JSON, ubah menjadi object
    if (typeof data === "string") {
        try {
            data = JSON.parse(data);
        } catch (error) {
            return;
        }
    }

    // Pastikan token sesuai dengan pengiriman ulasan saat ini
    if (!data || data.token !== reviewToken) {
        console.log("Token tidak cocok:", data);
        return;
    }

    const button = document.getElementById("sendReviewBtn");
    const status = document.getElementById("reviewStatus");

    if (data.status === "success") {

        console.log("Ulasan berhasil disimpan.");

        reviewSending = false;

        try {
            localStorage.removeItem(STORAGE_KEY);
        } catch (error) {
            console.warn(error);
        }

        // Tampilkan halaman hasil kuis
        renderResult(pendingQuizResult);

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else if (data.status === "error") {

        console.log("Gagal menyimpan ulasan:", data.message);

        reviewSending = false;

        if (button) {
            button.disabled = false;
            button.textContent = "Coba Kirim Ulang";
        }

        if (status) {
            status.textContent =
                "Ulasan belum berhasil disimpan. " +
                (data.message || "Silakan coba lagi.");
        }
    }

});
